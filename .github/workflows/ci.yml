name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Locate Composer cache
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test

      - name: Audit dependencies
        run: composer audit

      - name: Check PHP syntax
        run: composer syntax

  woocommerce-compatibility:
    needs: test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4.7@sha256:39596f079862334be04f4231664862e55d4febe54309cc62f750f2297de85b06
        env:
          MARIADB_DATABASE: bastion_test
          MARIADB_USER: bastion
          MARIADB_PASSWORD: bastion
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mysqli, zip
          coverage: none
          tools: composer:v2

      - name: Run pinned WooCommerce integration
        shell: bash
        env:
          WP_SHA256: f0885ad10c35ac87e70517bc5789275cd54ccac052222a58acfb7b9f870082b0
          WC_SHA256: 88837ea0504544fdb835078d39c68c6c4abde00cdb4af8f67027255ee8ae494c
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/bastion-wc-compat"
          trap 'rm -rf -- "$fixture"' EXIT
          rm -rf -- "$fixture"
          mkdir -p "$fixture/downloads" "$fixture/site"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$fixture/downloads/wordpress.zip" \
            https://downloads.wordpress.org/release/wordpress-7.0.4.zip
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$fixture/downloads/woocommerce.zip" \
            https://github.com/woocommerce/woocommerce/releases/download/11.0.1/woocommerce.zip
          echo "$WP_SHA256  $fixture/downloads/wordpress.zip" | sha256sum --check --strict
          echo "$WC_SHA256  $fixture/downloads/woocommerce.zip" | sha256sum --check --strict
          validate_archive() {
            local archive="$1" root="$2"
            php tests/Integration/ArchiveValidator.php "$archive" "$root" || return 1
            zipinfo -l "$archive" | awk '$1 ~ /^l/ { bad=1 } END { exit bad }' || return 1
          }
          validate_archive "$fixture/downloads/wordpress.zip" wordpress
          validate_archive "$fixture/downloads/woocommerce.zip" woocommerce
          unzip -q "$fixture/downloads/wordpress.zip" -d "$fixture/site"
          unzip -q "$fixture/downloads/woocommerce.zip" -d "$fixture/site/wordpress/wp-content/plugins"
          composer install --no-dev --classmap-authoritative --no-interaction --no-progress --no-scripts
          mkdir "$fixture/site/wordpress/wp-content/plugins/bastion-security-wp"
          cp -a bastion-security-wp.php composer.json composer.lock README.md src vendor \
            "$fixture/site/wordpress/wp-content/plugins/bastion-security-wp/"
          cp "$fixture/site/wordpress/wp-config-sample.php" "$fixture/site/wordpress/wp-config.php"
          sed -i \
            -e "s/database_name_here/bastion_test/" \
            -e "s/username_here/bastion/" \
            -e "s/password_here/bastion/" \
            -e "s/localhost/127.0.0.1/" \
            "$fixture/site/wordpress/wp-config.php"
          install_result="$(php tests/Integration/InstallWordPress.php "$fixture/site/wordpress")"
          printf '%s\n' "$install_result"
          grep -Fxq 'BASTION_WP_INSTALL_OK: WordPress installed' <<< "$install_result"
          php tests/Integration/FixtureLifecycle.php verify "$fixture/site/wordpress"
          php tests/Integration/FixtureLifecycle.php activate "$fixture/site/wordpress"
          result="$(php tests/Integration/WooCommerceRestInventory.php "$fixture/site/wordpress")"
          printf '%s\n' "$result"
          grep -Fxq 'BASTION_WC_COMPAT_OK: inventory assertions passed' <<< "$result"
          rm -f "$fixture/site/wordpress/wp-config.php"
